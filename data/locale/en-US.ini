AudioBufferHelp="Target Buffer is the jitter cushion and the main latency knob. Adaptive Latency Control keeps audio near native rate with bounded speed correction; backlog from a stall is played back slightly sped up instead of skipped. Lower values reduce delay but make silence or hitches more likely on bad signal."

