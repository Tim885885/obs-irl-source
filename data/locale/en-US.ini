WaitForKeyframe="Wait for Keyframe on Start/Reconnect"
LowLatencyAudio="Use OBS Low-Latency Async Audio Mode"
ClearOnDisconnect="Show Nothing When the Stream Ends"
CloseWhenInactive="Close Stream When Inactive"
AdvancedHelp="Wait for Keyframe avoids corrupt startup/reconnect frames, but it can add up to one keyframe interval of delay. The low-latency option enables OBS async unbuffered audio mode for this source and makes the plugin drain immediately instead of building the normal jitter cushion, so it is faster but less tolerant of jitter. Show Nothing When the Stream Ends blanks the source as soon as the stream drops, instead of leaving the last frame frozen on screen until it reconnects. Close Stream When Inactive stops receiving when the source is not active, clearing the frame if the option above is on. FFmpeg Options can override any demuxer option, for example buffer_size or the SRT latency."

