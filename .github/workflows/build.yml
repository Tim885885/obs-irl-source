name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libobs-dev \
            libavformat-dev libavcodec-dev libswresample-dev \
            libavfilter-dev libswscale-dev libavutil-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-irl-source-linux-x64
          path: build/obs-irl-source.so

  windows-x64:
    name: windows-x64 (obs ${{ matrix.obs_line }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          # OBS 32.1.x bundles FFmpeg 7 (avcodec-61) via obs-deps 2025-08-23.
          # A plugin linked against this loads on 32.1.x and, thanks to the
          # forward-compatible libobs module gate, on newer lines too, but only
          # where FFmpeg 7 DLLs are present.
          - obs_line: "32.1"
            obs_version: "32.1.2"
            obs_deps_version: "2025-08-23"
          # OBS 32.2.x bundles FFmpeg 8.1 (avcodec-62) via obs-deps 2026-07-15.
          # FFmpeg's major bump (obsproject/obs-deps 2025-12-23) changes the DLL
          # sonames, so this artifact is a separate binary that only resolves
          # against 32.2.x. Bump obs_version to 32.2.0 once the final tag ships.
          - obs_line: "32.2"
            obs_version: "32.2.0-rc2"
            obs_deps_version: "2026-07-15"
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache OBS build
        id: cache-obs
        uses: actions/cache@v4
        with:
          path: |
            obs-src
            obs-deps
          key: obs-build-${{ matrix.obs_version }}-${{ matrix.obs_deps_version }}-v2

      - name: Download OBS dependencies
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-deps/releases/download/${{ matrix.obs_deps_version }}/windows-deps-${{ matrix.obs_deps_version }}-x64.zip" `
            -OutFile obs-deps.zip
          Expand-Archive obs-deps.zip -DestinationPath obs-deps

      - name: Clone OBS source
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ matrix.obs_version }} https://github.com/obsproject/obs-studio.git obs-src

      - name: Patch OBS to build only libobs
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Keep only libobs + w32-pthreads, remove all other subdirectories
          # (plugins, frontend, renderers, tests)
          $lines = Get-Content obs-src/CMakeLists.txt
          $output = @()
          $done = $false
          foreach ($line in $lines) {
            if ($done) { continue }
            if ($line -match '^\s*add_subdirectory\(libobs\)\s*$') {
              $output += 'add_subdirectory(deps/w32-pthreads)'
              $output += $line
              $done = $true
            } else {
              $output += $line
            }
          }
          $output | Set-Content obs-src/CMakeLists.txt

          # Disable automatic dependency download (we provide deps via CMAKE_PREFIX_PATH)
          (Get-Content obs-src/cmake/windows/defaults.cmake) `
            -replace '^include\(buildspec\)', '# include(buildspec)' |
            Set-Content obs-src/cmake/windows/defaults.cmake

          # Skip multi-architecture subprocess builds (OBS normally launches
          # a child cmake for x86 which would fail in our stripped-down tree)
          @"
          include_guard(GLOBAL)
          include(compilerconfig)
          if(NOT DEFINED OBS_PARENT_ARCHITECTURE)
            set(OBS_PARENT_ARCHITECTURE `${CMAKE_VS_PLATFORM_NAME})
          endif()
          "@ | Set-Content obs-src/cmake/windows/architecture.cmake

      - name: Configure OBS
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: cmd
        run: >
          cmake -S obs-src -B obs-src/build
          -G "Visual Studio 18 2026" -A x64
          -DCMAKE_PREFIX_PATH=%CD%\obs-deps
          -DENABLE_UI=OFF
          -DENABLE_PLUGINS=OFF

      - name: Build OBS (libobs only)
        if: steps.cache-obs.outputs.cache-hit != 'true'
        shell: cmd
        run: cmake --build obs-src/build --config Release --target libobs --target w32-pthreads

      - name: Configure
        shell: cmd
        run: >
          cmake -B build
          -G "Visual Studio 18 2026" -A x64
          -DOBS_SOURCE_DIR=%CD%\obs-src
          -DFFMPEG_DIR=%CD%\obs-deps

      - name: Build
        shell: cmd
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Collect runtime dependencies
        shell: pwsh
        run: |
          # Copy w32-pthreads.dll next to the plugin
          $w32dll = Get-ChildItem -Path obs-src/build/deps/w32-pthreads -Filter "w32-pthreads.dll" -Recurse | Select-Object -First 1
          if ($w32dll) {
            Copy-Item $w32dll.FullName build/RelWithDebInfo/
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-irl-source-windows-x64-obs${{ matrix.obs_line }}
          path: |
            build/RelWithDebInfo/obs-irl-source.dll
            build/RelWithDebInfo/w32-pthreads.dll

  macos-arm64:
    name: macos-arm64 (obs ${{ matrix.obs_line }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - obs_line: "32.1"
            obs_version: "32.1.2"
            obs_deps_version: "2025-08-23"
            runner: "macos-15"
          # OBS 32.2 requires the macOS 26.5 SDK (Xcode 26.5); macos-15 ships
          # only SDK 15.5, so this line needs the macos-26 image.
          - obs_line: "32.2"
            obs_version: "32.2.0-rc2"
            obs_deps_version: "2026-07-15"
            runner: "macos-26"
    steps:
      - uses: actions/checkout@v4

      # ffmpeg is intentionally NOT installed from Homebrew. The plugin must
      # link the same FFmpeg that OBS bundles (from obs-deps), so its runtime
      # dylib references resolve against OBS.app's Frameworks. Homebrew ffmpeg
      # has a different soname per OBS line and absolute (non-@rpath) install
      # names, so a brew-linked plugin only loads where brew's FFmpeg matches.
      - name: Install build tools
        run: brew install cmake pkg-config simde uthash jansson

      - name: Cache OBS build
        id: cache-obs
        uses: actions/cache@v4
        with:
          path: |
            obs-src
            obs-deps
          key: obs-macos-arm64-${{ matrix.obs_version }}-${{ matrix.obs_deps_version }}-v2

      - name: Download OBS dependencies
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: |
          curl -L -o macos-deps.tar.xz \
            "https://github.com/obsproject/obs-deps/releases/download/${{ matrix.obs_deps_version }}/macos-deps-${{ matrix.obs_deps_version }}-arm64.tar.xz"
          mkdir -p obs-deps
          tar -xf macos-deps.tar.xz -C obs-deps

      - name: Clone OBS source
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ matrix.obs_version }} https://github.com/obsproject/obs-studio.git obs-src

      - name: Patch OBS to build only libobs
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: |
          # Truncate CMakeLists.txt after add_subdirectory(libobs)
          sed -i '' '/^add_subdirectory(libobs)/q' obs-src/CMakeLists.txt

          # Disable automatic dependency download
          sed -i '' 's/^include(buildspec)/# include(buildspec)/' obs-src/cmake/macos/defaults.cmake

          # Allow Homebrew paths (OBS blocks them by default)
          sed -i '' '/CMAKE_IGNORE_PREFIX_PATH/d' obs-src/cmake/macos/defaults.cmake

          # Relax OBS's SDK/Xcode floor. OBS gates the whole app on a very
          # recent SDK (32.2 wants macOS 26.5 / Xcode 26.5), but we only build
          # libobs with the UI off, which compiles on the runner's SDK. No-op
          # on lines whose floor the runner already satisfies.
          sed -i '' -E 's/set\(obs_macos_minimum_sdk [0-9.]+\)/set(obs_macos_minimum_sdk 1.0)/' obs-src/cmake/macos/compilerconfig.cmake
          sed -i '' -E 's/set\(obs_macos_minimum_xcode [0-9.]+\)/set(obs_macos_minimum_xcode 1.0)/' obs-src/cmake/macos/compilerconfig.cmake

      - name: Configure OBS
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: >
          cmake -S obs-src -B obs-src/build
          -G Xcode
          -DENABLE_UI=OFF
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_PREFIX_PATH="$PWD/obs-deps;$(brew --prefix)"

      - name: Build OBS (libobs only)
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: cmake --build obs-src/build --config Release --target libobs --parallel

      # Force the manual FFmpeg discovery path (FFMPEG_DIR) instead of
      # pkg-config. This links obs-deps' FFmpeg directly by library, preserving
      # its @rpath install names, and avoids picking up any FFmpeg .pc files
      # that the runner image or a relocated obs-deps prefix might expose.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DOBS_SOURCE_DIR=$PWD/obs-src
          -DFFMPEG_DIR=$PWD/obs-deps
          -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          -DCMAKE_C_FLAGS="-I$(brew --prefix)/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-irl-source-macos-arm64-obs${{ matrix.obs_line }}
          path: build/obs-irl-source.so
